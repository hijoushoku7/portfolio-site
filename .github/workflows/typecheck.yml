name: Type Check

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/workflows/*'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run astro check
