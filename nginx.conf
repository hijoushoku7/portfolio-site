server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ハッシュ付きアセット(Astro生成: CSS/JS/フォント/src/assets画像)
    location ^~ /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 自前サブセット化フォント(ハッシュ付き) — 1ヶ月
    location ^~ /fonts/generated/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # public/fonts/ — 名前固定だが実質差し替えない
    location ^~ /fonts/ {
        add_header Cache-Control "public, max-age=31536000";
    }

    # public/ の画像 — 差し替えあり得るので1日
    location ~* \.(avif|webp|png|jpe?g|gif|svg|ico)$ {
        add_header Cache-Control "public, max-age=86400";
    }

    # HTML は毎回検証(変わってなければ304)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
